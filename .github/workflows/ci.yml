name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-22.04 # LTS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x' # LTS
          cache: 'npm'
          cache-dependency-path: control/package-lock.json

      - name: Install dependencies
        working-directory: control
        run: npm ci

      - name: Run unit tests
        working-directory: control
        run: npm test
